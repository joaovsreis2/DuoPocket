<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuoGBA</title><link rel="stylesheet" href="./gba.css"></head><body><header><div class="brand-dot"></div><div><strong>DuoGBA</strong><span>núcleo próprio · ARM7TDMI</span></div><div class="header-actions"><label class="speed-control" for="speed"><span>Velocidade</span><select id="speed" title="Velocidade da emulação (atalho: F)"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="pause">Pausar</button><button id="reset">Reiniciar</button></div></header><main><div class="screen-wrap"><canvas id="screen" width="240" height="160" aria-label="Tela do jogo"></canvas><div id="status">Carregando ROM…</div></div><section class="controls"><div class="dpad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="down">▼</button></div><div class="center"><kbd>Enter</kbd><small>START</small><kbd>Shift</kbd><small>SELECT</small></div><div class="ab"><button data-key="b">B</button><button data-key="a">A</button></div><div class="shoulders"><button data-key="l">L</button><button data-key="r">R</button></div></section></main><script src="./gba-bundle.js"></script></body></html>
